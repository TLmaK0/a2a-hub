name: registry prune

# Deletes stale image versions automatically.
#
# WHY THIS EXISTS — and it is privacy, not disk space. When this repo was published, the
# git history was sanitised (a private host name and references to an old secret were
# removed). Images built BEFORE that sanitisation still contain those strings inside a
# layer, so while they exist, what was removed from the public repo is still downloadable.
# A report does not fix that; deleting does.
#
# Deleting package versions is irreversible, and the untagged children of the RUNNING
# image are indistinguishable from orphans, so the rules below are refusals, not
# intentions. They are the safety argument, and none of them is optional.

on:
  schedule:
    # Weekly, off-peak, not on :00.
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      grace_days:
        description: "Delete tree-* versions older than this many days"
        required: false
        default: "30"
  # Run on PRs that touch this job, so the resolution half is exercised before it is ever
  # armed. Without this the job's only proof is a run of an older revision of itself — the
  # trap that let a missing checkout survive review here.
  pull_request:
    paths:
      - ".github/workflows/registry-prune.yml"
      - ".github/scripts/prune_plan.py"

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  prune:
    name: prune stale versions
    runs-on: ubuntu-latest
    steps:
      # The plan lives in a file in this repo, so the job needs the repo. Obvious in
      # hindsight; the job cannot run at all without it.
      - uses: actions/checkout@v4

      - name: Resolve, then delete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GRACE_DAYS: ${{ inputs.grace_days || '30' }}
          # Arming gate: until this repository variable is exactly "true", the job resolves
          # and reports what it WOULD delete and deletes nothing. That makes the first run
          # a dry run whose list can be authorised once; after the variable is set the job
          # deletes on its own, with no further approval.
          ARMED: ${{ vars.REGISTRY_PRUNE_ARMED }}
          # A pull request is a place to check the resolution, never a place to delete —
          # otherwise arming the variable turns every PR that edits this file into a live
          # prune of whatever that branch's version of the rules decides.
          EVENT: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
          PKG: a2a-hub
          # Sanitisation cut agreed with Hugo: this build and anything newer is kept.
          CUT_TAG: sha-e4fa405a7f1a39055589464c655f575b5100942f
        run: |
          set -euo pipefail

          # Fail closed on any API trouble: a 403/404 from `gh api` still writes JSON to
          # stdout, so "output is non-empty" proves nothing. Check the exit code.
          # --paginate, because one page is not the registry. Each merged PR adds three
          # versions, so a single 100-item page stops being the whole truth in weeks, and a
          # listing that silently ends at 100 would quietly stop protecting whatever fell
          # off the end. --slurp returns one array PER PAGE; the plan flattens that.
          if ! gh api --paginate --slurp \
                 "/users/${OWNER}/packages/container/${PKG}/versions?per_page=100" > versions.json; then
            echo "::error::Could not list package versions. Deleting nothing."
            exit 1
          fi

          # What must survive is decided by what still POINTS at an image, not by how old
          # it is. A tree-* tag is a git tree hash, so every open PR's head resolves to the
          # exact tag that must not be deleted. Any failure here means we do not know what
          # is referenced, and not knowing deletes nothing.
          if ! gh pr list --repo "$REPO" --state open --limit 100 --json headRefOid \
                 --jq '.[].headRefOid' > heads.txt; then
            echo "::error::Could not list open pull requests. Deleting nothing."
            exit 1
          fi
          : > live_trees.txt
          while read -r sha; do
            [ -n "$sha" ] || continue
            if ! gh api "repos/${REPO}/commits/${sha}" --jq '.commit.tree.sha' >> live_trees.txt; then
              echo "::error::Could not resolve the tree of ${sha}. Deleting nothing."
              exit 1
            fi
          done < heads.txt

          # The digest the deployment actually pins, read from the public promoted branch —
          # no credential, and it is the same source the deploy consumes.
          if ! gh api "repos/${REPO}/contents/promoted.json?ref=promoted" \
                 --jq '.content' | base64 -d > promoted.json; then
            echo "::error::Could not read the promoted digest. Deleting nothing."
            exit 1
          fi
          pinned=$(python3 -c 'import json;print(json.load(open("promoted.json"))["digest"])')

          python3 .github/scripts/prune_plan.py \
            versions.json "$GRACE_DAYS" "$CUT_TAG" live_trees.txt "$pinned" > plan.txt

          cat plan.txt >> "$GITHUB_STEP_SUMMARY"
          cat plan.txt

          ids=$(awk '/^--- DELETE ---$/{f=1;next} /^--- KEEP ---$/{f=0} f{print $1}' plan.txt)

          if [ -z "$ids" ]; then
            echo "Nothing to delete."
            exit 0
          fi

          if [ "$EVENT" = "pull_request" ]; then
            echo "::notice::Pull request run — resolution checked, deletion never attempted."
            exit 0
          fi

          if [ "${ARMED:-}" != "true" ]; then
            echo "::notice::NOT ARMED — this is the dry run. The list above is what would be"\
                 "deleted. Set the repository variable REGISTRY_PRUNE_ARMED=true to authorise"\
                 "it, after which this job deletes automatically without asking again."
            exit 0
          fi

          # Re-resolve what is referenced RIGHT NOW, not when the plan was drawn. Between
          # the two, a PR can open and publish, or a merge can promote. The plan is a
          # proposal; the state at the instant of deleting is what decides.
          if ! gh pr list --repo "$REPO" --state open --limit 100 --json headRefOid \
                 --jq '.[].headRefOid' > heads_now.txt; then
            echo "::error::Could not re-check open pull requests. Deleting nothing."
            exit 1
          fi
          : > live_trees_now.txt
          while read -r sha; do
            [ -n "$sha" ] || continue
            if ! gh api "repos/${REPO}/commits/${sha}" --jq '.commit.tree.sha' >> live_trees_now.txt; then
              echo "::error::Could not re-resolve the tree of ${sha}. Deleting nothing."
              exit 1
            fi
          done < heads_now.txt

          # One at a time, re-reading each version immediately before deleting it and
          # aborting on the first surprise rather than pressing on through a partially
          # broken state. A stale plan must not be able to delete a live image.
          for id in $ids; do
            if ! gh api "/users/${OWNER}/packages/container/${PKG}/versions/${id}" > version.json; then
              echo "::error::Could not re-read version ${id}. Stopping; nothing further is attempted."
              exit 1
            fi
            python3 .github/scripts/confirm_deletable.py version.json live_trees_now.txt "$pinned"

            if gh api -X DELETE "/users/${OWNER}/packages/container/${PKG}/versions/${id}"; then
              echo "deleted $id"
            else
              echo "::error::Failed to delete ${id}. Stopping here; nothing further is attempted."
              exit 1
            fi
          done
