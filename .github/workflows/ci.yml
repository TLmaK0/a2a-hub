name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/tlmak0/a2a-hub

jobs:
  # Decide, from the FILES this event changed, whether it is documentation only.
  # `[skip ci]` used to stand in for this and it verifies nothing: a commit carrying
  # three `.md` AND one `.py` with `[skip ci]` lands on main with no lint, no tests
  # and no coverage having run — and looks green because nothing ran. The owner's
  # call: that escape hatch must not exist ("pues no debe existir el skip ci"). So
  # the workflow measures the change instead: a docs-only change skips the build and
  # the promotion BY ITSELF, and anything else runs everything, so there is no
  # reason left to write `[skip ci]`.
  #
  # WHAT COUNTS AS DOCUMENTATION is `_DOCS` below and nothing else: files ending in
  # `.md`. Not manifests, not the Dockerfile, not workflows, not code, not tests —
  # whatever the commit message says. One entry is not obviously right: `README.md`
  # is documentation by any reading AND an input to the image (the Dockerfile copies
  # it because pyproject's `readme` needs it). Under the literal rule a README-only
  # merge does not build, so the running image keeps the previous README text until
  # something else builds. Same consequence lexboe chose; flagged so it stays a
  # choice rather than a discovery.
  #
  # It FAILS TOWARDS RUNNING: an empty or uncomputable diff classifies as "not docs
  # only". A false "docs only" lets code onto main with no gates; a false "has code"
  # wastes a runner. Those prices are not comparable.
  #
  # The decision block between the markers is lifted verbatim and exercised by
  # tests/test_ci_docs_only_guard.py, so what is tested cannot drift from what ships.
  decide:
    name: decide whether this change is documentation only
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.verdict.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the diff below needs history beyond the head commit
      - name: Decide whether this change touches only documentation
        id: verdict
        run: |
          # On a push the diff is against the ref the push replaced
          # (`github.event.before`), which covers EVERY commit in the push — the
          # approach lexboe's deploy.yml already uses. On a pull request it is
          # against the base. A diff that cannot be computed (first push to a ref,
          # force push whose old head is gone) comes out empty through `|| true`,
          # and empty is classified below as NOT docs-only: fail towards running.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE_FROM='${{ github.event.pull_request.base.sha }}'
          else
            RANGE_FROM='${{ github.event.before }}'
          fi
          CHANGED=$(git diff --name-only "$RANGE_FROM" '${{ github.sha }}' 2>/dev/null || true)
          # --- decision block ---
          _DOCS='\.md$'
          docs_only=true
          [ -z "$CHANGED" ] && docs_only=false
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            printf '%s' "$path" | grep -qE "$_DOCS" || docs_only=false
          done <<EOF
          $CHANGED
          EOF
          # --- end decision block ---
          if [ "$docs_only" = 'true' ]; then
            echo "documentation only — no image to build or promote"
          else
            echo "changes something an image is built from — everything runs"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" | sed 's/^/  changed: /'

  test:
    name: test
    needs: decide
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `uv.lock` is a generated file that lives in the repo, so it is a cache: if
      # nothing checks it against `pyproject.toml`, it gets used stale and in silence.
      # `--frozen` below is NOT that check — it means "do not update the lock", not
      # "the lock matches its source". Measured on a tree with a dependency added to
      # `pyproject.toml` and the lock deliberately left alone:
      #
      #   uv lock --check     -> exit 1   "The lockfile at `uv.lock` needs to be updated"
      #   uv sync --frozen    -> exit 0   and the lock stays stale
      #
      # The dangerous case is not a new import (the code would fail to import and
      # pytest would catch it by luck) but a changed version constraint: bump a
      # dependency, forget the lock, and the gate is green while the image ships the
      # old version. `pyproject.toml` then documents a dependency set that nothing is
      # built from, and nothing says so.
      #
      # This runs BEFORE the sync, and it has to: `uv run` re-resolves and rewrites
      # the lock unless told not to, so any check placed after the test step passes
      # because the test step already repaired the file. Measured while writing this —
      # a first probe reported "all fine" for exactly that reason.
      - name: Check uv.lock is current with pyproject.toml
        run: uv lock --check

      - name: Sync dependencies (runtime + dev)
        run: uv sync --frozen

      # The minimum coverage (>=90%) is enforced in pyproject.toml
      # (--cov-fail-under=90): this job gates the image publish.
      #
      # `--frozen` so this step cannot quietly re-resolve and rewrite `uv.lock` the way
      # a bare `uv run` does. The check above already fails the job first, so this is
      # redundant today — it is here so that reordering the steps cannot restore the
      # hole, because the step that repairs the artifact is the one that hides it.
      - name: Tests + coverage (pytest)
        run: uv run --frozen pytest

      # The image is identified by the git TREE, not the commit. A tree hash is the
      # hash of the content, so it survives a rebase: the commit sha changes, the tree
      # does not. That is what lets `publish` find the artifact this job validated even
      # though merging rebases the branch onto main and rewrites the commit sha.
      - name: Resolve content id (git tree)
        id: tree
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Never push an image built from a fork: on fork PRs the GITHUB_TOKEN is
      # read-only by design, and pushing code from an untrusted branch into our own
      # registry namespace is not something to do by default. Forks are validated by
      # building without pushing; see the fork note in `publish`.
      #
      # And never build for a documentation-only change (`decide` above): no byte an
      # image is built from moved, so there is nothing new to validate. The tests
      # above still run — they are cheap and a gate that always runs cannot be
      # skipped by a misclassification.
      - name: Log in to GHCR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.decide.outputs.docs_only != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build ONCE, here, and keep the artifact. What gets promoted to production is
      # this exact digest — production never gets a rebuild, because a rebuild is a
      # different artifact than the one that passed the gate (base image drift,
      # timestamps, resolved layers) even from identical sources.
      - name: Build and push the validated image
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.decide.outputs.docs_only != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:tree-${{ steps.tree.outputs.tree }}
          cache-from: type=gha,scope=a2a-hub
          cache-to: type=gha,mode=max,scope=a2a-hub

      # Fork PRs and pushes to main: prove the image still builds, without pushing.
      # On a push to main the artifact already exists from the PR, so rebuilding here
      # would defeat the purpose; this only runs for forks.
      - name: Build image (no push, fork PRs)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && needs.decide.outputs.docs_only != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=a2a-hub

  # Promote the image that the gate validated. This job does NOT build: it retags the
  # exact digest produced in the PR as the production tags, so what runs in production
  # is bit-for-bit what passed CI.
  publish:
    name: promote validated image
    # `decide` is named explicitly: on a documentation-only merge this job still
    # runs, but it promotes NOTHING — it carries the previous digest forward (see
    # the last steps). Skipping the whole job instead would leave `promoted.json`
    # naming a sha that is no longer main's head, and the infra repo's hourly bump
    # refuses to deploy anything whose head it cannot verify: every hour would go
    # red until the next code merge.
    needs: [test, decide]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` is required to push the `promoted` branch; the default read
      # token gets a 403. Scoped to this job, which only runs on pushes to main.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: needs.decide.outputs.docs_only != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: needs.decide.outputs.docs_only != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Merging rebases the branch, so main's commit sha is new — but its tree is the
      # content that was validated, so the tag still resolves. If it does not, the
      # content on main is not what CI approved (a conflicting rebase, a fork PR, a
      # direct push) and we FAIL rather than quietly rebuild: shipping an unvalidated
      # artifact to shared infrastructure is the failure mode this job exists to stop.
      - name: Find the validated image for this content
        if: needs.decide.outputs.docs_only != 'true'
        id: find
        run: |
          tree="$(git rev-parse HEAD^{tree})"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          if ! docker buildx imagetools inspect "${IMAGE}:tree-${tree}" >/dev/null 2>&1; then
            echo "::error::No validated image for tree ${tree}. Nothing was built for the"\
                 "content now on main, so there is nothing to promote. This happens when a"\
                 "rebase changed the content, when the PR came from a fork, or on a direct"\
                 "push to main. Re-run CI on a PR whose head matches main, and merge with a"\
                 "clean rebase."
            exit 1
          fi
          echo "Found validated image: ${IMAGE}:tree-${tree}"

      # `imagetools create` writes new tags pointing at the SAME manifest digest. It
      # does not pull, rebuild or re-upload layers, and it does not create a new
      # package version — the production tags simply join the version the PR published.
      - name: Promote it to the production tags
        if: needs.decide.outputs.docs_only != 'true'
        run: |
          tree="${{ steps.find.outputs.tree }}"
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            "${IMAGE}:tree-${tree}"
          echo "Promoted (same digest, no rebuild):"
          docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}" | head -5

      # Publish which digest is now the validated one, on a branch anyone can read without
      # credentials. The deployment repo cannot read this private package (its token is
      # scoped to itself), but this repo is public — so this is what lets the deploy chain
      # resolve the image with no secret at all.
      - name: Record the promoted digest publicly
        if: needs.decide.outputs.docs_only != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTED_BRANCH: promoted
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}" \
                      --format '{{.Manifest.Digest}}')"
          .github/scripts/record_promoted.sh "${PROMOTED_BRANCH}" "${GITHUB_SHA}" "${digest}"

      # A documentation-only merge has no new image — the PR deliberately built
      # none — but `promoted.json` must still name main's head: the infra repo's
      # hourly bump reads it, requires the recorded sha to BE the head, and goes
      # red otherwise. So carry the previous digest forward under the new sha. The
      # claim this records is sound because `decide` measured it: nothing an image
      # is built from changed, so the image that served the commit this push
      # replaced serves this one too (minus the new .md text — the README trade
      # documented on `decide`).
      #
      # Guarded: the previous record must name exactly `github.event.before`. If
      # promotion was already behind main — a direct push whose publish went red —
      # carrying forward would certify content that never passed the gate, so this
      # fails red instead, which is the same alarm a direct push raises today.
      # A missing `promoted` branch fails the fetch, red and loud, for the same
      # reason.
      - name: Carry the previous digest forward (documentation-only merge)
        if: needs.decide.outputs.docs_only == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTED_BRANCH: promoted
        run: |
          git fetch --depth 1 origin "${PROMOTED_BRANCH}"
          prev_sha="$(git show FETCH_HEAD:promoted.json | jq -r .sha)"
          digest="$(git show FETCH_HEAD:promoted.json | jq -r .digest)"
          if [ "${prev_sha}" != "${{ github.event.before }}" ]; then
            echo "::error::promoted.json records ${prev_sha}, but this push replaced"\
                 "${{ github.event.before }}. Promotion is behind main, so there is no"\
                 "validated image to carry forward for a docs-only merge. Repair the"\
                 "promotion of the commit behind first (re-run its publish), then"\
                 "re-run this job."
            exit 1
          fi
          .github/scripts/record_promoted.sh "${PROMOTED_BRANCH}" "${GITHUB_SHA}" "${digest}"
          echo "carried forward: ${GITHUB_SHA} -> ${digest} (same digest, no build, no deploy)"

      # Optional: tell a deployment repo that a new image is available. No-op unless
      # both the INFRA_REPO variable (owner/repo) and the INFRA_DISPATCH_TOKEN secret
      # (a fine-grained PAT with Contents: write on that repo) are configured.
      #
      # Not on a documentation-only merge: there is no new image to announce, and the
      # dispatch path `set image`s a `sha-<commit>` tag that a docs-only merge never
      # creates. The hourly bump still reconciles — it will find the carried-forward
      # digest already pinned and apply a no-op, which restarts nothing.
      - name: Notify deployment repo
        if: needs.decide.outputs.docs_only != 'true'
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          INFRA_REPO: ${{ vars.INFRA_REPO }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$INFRA_REPO" ]; then
            echo "INFRA_REPO/INFRA_DISPATCH_TOKEN not configured; skipping deploy trigger."
            exit 0
          fi
          gh api "repos/${INFRA_REPO}/dispatches" \
            -f event_type=a2a-hub-deploy \
            -F client_payload[sha]="${GITHUB_SHA}"
